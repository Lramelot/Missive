      en: "Folder created. Add chats to it with a right-click."
      fr: "Dossier créé. Ajoutez-y des discussions par clic droit."
    folder_deleted:
      en: "Folder deleted"
      fr: "Dossier supprimé"
  confirm:
    delete_thread:
      title:
        en: "Delete conversation?"
        fr: "Supprimer la conversation ?"
      text:
        en: "The conversation “%{name}” and its history will be deleted from your account. This can't be undone."
        fr: "La conversation « %{name} » et son historique seront supprimés de votre compte. Cette action est définitive."
      button:
        en: "Delete"
        fr: "Supprimer"
    leave_group:
      title:
        en: "Leave group?"
        fr: "Quitter le groupe ?"
      text:
        en: "You will no longer receive messages from “%{name}”."
        fr: "Vous ne recevrez plus les messages de « %{name} »."
      button:
        en: "Leave"
        fr: "Quitter"
    block:
      fallback_name:
        en: "this person"
        fr: "cette personne"
      title:
        en: "Block %{name}?"
        fr: "Bloquer %{name} ?"
      text:
        en: "This person won't be able to send you messages or call you on Messenger."
        fr: "Cette personne ne pourra plus vous envoyer de messages ni vous appeler sur Messenger."
      button:
        en: "Block"
        fr: "Bloquer"
    unblock:
      title:
        en: "Unblock %{name}?"
        fr: "Débloquer %{name} ?"
      text:
        en: "This person will be able to contact you on Messenger again."
        fr: "Cette personne pourra de nouveau vous contacter sur Messenger."
      button:
        en: "Unblock"
        fr: "Débloquer"
    delete_folder:
      title:
        en: "Delete folder “%{name}”?"
        fr: "Supprimer le dossier « %{name} » ?"
      text:
        en: "The conversations stay in your chats, only the folder goes away."
        fr: "Les conversations restent dans vos discussions, seul le dossier disparaît."
      button:
        en: "Delete"
        fr: "Supprimer"
    remove_member:
      fallback_name:
        en: "This member"
        fr: "Ce membre"
      title:
        en: "Remove %{member} from the group?"
        fr: "Retirer %{member} du groupe ?"
      text:
        en: "%{member} will no longer be able to take part in “%{group}”."
        fr: "%{member} ne pourra plus participer à « %{group} »."
      button:
        en: "Remove"
        fr: "Retirer"
