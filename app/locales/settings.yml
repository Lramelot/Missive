      en: "When off, you read discreetly: the sender cannot see that you have read the message. Replying or choosing “Mark as read” tells them."
      fr: "Désactivé, vous lisez en toute discrétion : l'expéditeur ne voit pas que vous avez lu. Répondre ou choisir « Marquer comme lu » le lui indique."
