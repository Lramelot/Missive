      en: "Enter a word or phrase."
      fr: "Saisissez un mot ou une expression."
    error_no_alphanumeric:
      en: "The keyword must contain at least one letter or digit."
      fr: "Le mot-clé doit contenir au moins une lettre ou un chiffre."
    error_too_long:
      en: "%{max} characters maximum."
      fr: "%{max} caractères au maximum."
    error_duplicate:
      en: "This keyword already exists."
      fr: "Ce mot-clé existe déjà."
