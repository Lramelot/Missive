    title:
      en: "Quiet hours"
      fr: "Heures calmes"
    description:
      en: "No notifications during this period, except priority conversations, mentions and keywords."
      fr: "Aucune notification sur cette plage, sauf conversations prioritaires, mentions et mots-clés."
