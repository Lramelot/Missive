      en: "Otherwise, the notification only says “New message”."
      fr: "Sinon, la notification indique seulement « Nouveau message »."
  keywords:
    title:
      en: "Override keywords"
      fr: "Mots-clés qui passent outre"
    description:
      en: "A message containing any of these words notifies you even when muted or during quiet hours. Case and accents are ignored."
      fr: "Un message contenant l'un de ces mots vous notifie même en sourdine ou pendant les heures calmes. Majuscules et accents sont ignorés."
